name: Build Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build APKs
        run: gradle :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace
      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Yadar-${GITHUB_SHA::7}.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/Yadar-debug-${GITHUB_SHA::7}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: yadar-apk
          path: out/Yadar-*.apk
          if-no-files-found: error
